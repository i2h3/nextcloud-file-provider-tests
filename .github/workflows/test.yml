name: Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/Documentation.docc/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/Documentation.docc/**'
  workflow_dispatch:

jobs:
  # Hosted runners have neither Docker nor a logged-in graphical session, so they can only run the
  # hermetic harness tests. The live suites report themselves as skipped there, which is exactly what
  # this job verifies stays true.
  hermetic:
    name: Harness
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Run hermetic tests
        run: swift test
